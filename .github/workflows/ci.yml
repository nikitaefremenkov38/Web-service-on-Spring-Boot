name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.14-eclipse-temurin-21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        if: ${{ hashFiles('mvnw') != '' }}
        run: chmod +x mvnw

      - name: Build, test, package
        run: mvn -B clean test package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: ./target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  sca:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.14-eclipse-temurin-21
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Dependency-Check (HTML)
        run: mvn -B -DskipTests dependency-check:check

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  dast_baseline:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: artifacts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start app
        run: java -jar artifacts/*.jar &

      - name: Wait for app
        run: sleep 25

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: http://localhost:8080
          rules_file_name: zap-rules.tsv
          cmd_options: -r zap-baseline-report.html
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP baseline report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html

  dast_api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: artifacts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start app
        run: java -jar artifacts/*.jar &

      - name: Wait for app
        run: sleep 25

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: openapi.yaml
          format: openapi
          rules_file_name: zap-rules.tsv
          cmd_options: -r zap-api-report.html
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP API report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report
          path: zap-api-report.html
